[pytest]
# 2026-11-09 审计第 2 批：把「必须带 -m "not slow"」从人肉纪律变成默认值。
# 不带 -m 会连上 arxiv 下载整篇 PDF，卡死在网络测试上（AGENTS §2.8 / §4.19）。
# 命令行显式给 -m 时仍可覆盖这里（pytest 的 -m 取最后一个），
# 所以 `pytest -m slow` 之类依然能跑。
testpaths = tests
addopts = -m "not slow"
markers =
    apk_toolchain: 需要 Android build-tools + JDK；用 MB_APKSIGNER_DIR / MB_JDK_DIR 指定路径
